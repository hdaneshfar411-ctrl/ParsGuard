<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ParsGuard Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar bg-dark text-white p-3">

        <h3 class="mb-4 text-center">

            <i class="bi bi-shield-lock-fill"></i>

            ParsGuard

        </h3>

        <div class="list-group list-group-flush">

            <a href="/panel/" class="list-group-item list-group-item-action bg-dark text-white border-0">

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>

            <a href="/users/" class="list-group-item list-group-item-action bg-dark text-white border-0">

                <i class="bi bi-people-fill"></i>

                Users

            </a>

            <a href="/servers/" class="list-group-item list-group-item-action bg-dark text-white border-0">

                <i class="bi bi-hdd-network-fill"></i>

                Servers

            </a>

            <a href="/logs/" class="list-group-item list-group-item-action bg-dark text-white border-0">

                <i class="bi bi-file-earmark-text-fill"></i>

                Logs

            </a>

            <a href="/settings/" class="list-group-item list-group-item-action bg-dark text-white border-0">

                <i class="bi bi-gear-fill"></i>

                Settings

            </a>

        </div>

    </div>

    <!-- Main -->

    <div class="flex-grow-1">

        <nav class="navbar navbar-light bg-white shadow-sm px-4">

            <h3 class="m-0">

                Dashboard

            </h3>

            <div>

                <span class="badge bg-primary p-2">

                    {{ username }}

                </span>

            </div>

        </nav>

        <div class="container-fluid mt-4">

            <div class="row g-4">

                <div class="col-lg-3">

                    <div class="card shadow">

                        <div class="card-body">

                            <h6>Total Users</h6>

                            <h2>0</h2>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="card shadow">

                        <div class="card-body">

                            <h6>Servers</h6>

                            <h2>1</h2>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="card shadow">

                        <div class="card-body">

                            <h6>Status</h6>

                            <h2 class="text-success">

                                Online

                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="card shadow">

                        <div class="card-body">

                            <h6>Traffic</h6>

                            <h2>0 GB</h2>

                        </div>

                    </div>

                </div>

            </div>
                        <div class="row mt-4">

                <div class="col-12">

                    <div class="card shadow">

                        <div class="card-header">

                            Recent Activity

                        </div>

                        <div class="card-body">

                            <table class="table table-hover">

                                <thead>

                                    <tr>

                                        <th>User</th>

                                        <th>IP</th>

                                        <th>Status</th>

                                    </tr>

                                </thead>

                                <tbody>

                                    <tr>

                                        <td>admin</td>

                                        <td>127.0.0.1</td>

                                        <td>

                                            <span class="badge bg-success">

                                                Online

                                            </span>

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/static/js/script.js"></script>

</body>

</html>
